<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelas — Buku Induk Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1 id="app-title">Buku Induk Siswa</h1>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="siswa.html">Data Siswa</a>
      <a href="kelas.html" class="active">Kelas</a>
      <a href="pengaturan.html">Pengaturan</a>
      <a href="#" onclick="doLogout()">Keluar</a>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <h3>Tambah Kelas</h3>
      <div class="field-row">
        <input id="new-nama" placeholder="Nama kelas, mis. XII IPA 1">
        <input id="new-tingkat" placeholder="Tingkat, mis. XII">
      </div>
      <input id="new-wali" placeholder="Wali kelas (nama, opsional)">
      <button class="btn" onclick="createKelas()">Tambah</button>
    </div>
    <div id="kelas-list">Memuat...</div>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();
    loadBranding();

    async function loadKelas() {
      const rows = await apiCall('listKelas', {});
      const el = document.getElementById('kelas-list');
      if (!rows.length) { el.innerHTML = '<p class="text-muted">Belum ada kelas.</p>'; return; }
      el.innerHTML = rows.map(k => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center">
          <div><strong>${escapeHtml(k.nama)}</strong> <span class="text-muted">${escapeHtml(k.tingkat || '')} ${k.wali_kelas ? '· Wali: ' + escapeHtml(k.wali_kelas) : ''}</span></div>
          <button class="btn small danger" onclick="removeKelas(${k.id})">Hapus</button>
        </div>`).join('');
    }

    async function createKelas() {
      const nama = document.getElementById('new-nama').value.trim();
      if (!nama) { alert('Nama kelas wajib diisi'); return; }
      await apiCall('createKelas', {
        data: {
          nama,
          tingkat: document.getElementById('new-tingkat').value.trim(),
          wali_kelas: document.getElementById('new-wali').value.trim(),
        }
      });
      document.getElementById('new-nama').value = '';
      document.getElementById('new-tingkat').value = '';
      document.getElementById('new-wali').value = '';
      loadKelas();
    }

    async function removeKelas(id) {
      if (!confirm('Hapus kelas ini? (siswa yang terdaftar di kelas ini tidak ikut terhapus)')) return;
      await apiCall('deleteKelas', { id });
      loadKelas();
    }

    loadKelas();
  </script>
</body>
</html>
