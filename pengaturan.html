<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan — Buku Induk Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1 id="app-title">Buku Induk Siswa</h1>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="siswa.html">Data Siswa</a>
      <a href="kelas.html">Kelas</a>
      <a href="pengaturan.html" class="active">Pengaturan</a>
      <a href="#" onclick="doLogout()">Keluar</a>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <h3>Identitas Sekolah</h3>
      <label>Logo Sekolah</label>
      <img id="logo-preview" class="photo-preview" style="width:80px;height:80px" src="">
      <input type="file" id="logo-file" accept="image/*">

      <label>Nama Sekolah</label>
      <input id="school-name">
      <label>Alamat Sekolah</label>
      <textarea id="school-address" rows="2"></textarea>

      <div class="field-row">
        <div><label>Judul Aplikasi (navbar)</label><input id="app-title-input"></div>
        <div><label>Judul Dokumen Cetak (KOP biodata)</label><input id="exam-title-input"></div>
      </div>

      <div class="field-row">
        <div><label>Warna Tema Aplikasi</label><input id="theme-color" type="color"></div>
        <div></div>
      </div>

      <h3>Penanda Tangan Lembar Cetak</h3>
      <div class="field-row">
        <div><label>Nama Kepala Sekolah</label><input id="kepsek-name"></div>
        <div><label>NIP Kepala Sekolah</label><input id="kepsek-nip"></div>
      </div>

      <button class="btn" onclick="saveSettings()">Simpan Pengaturan</button>
      <span id="save-status" class="text-muted"></span>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();
    loadBranding();

    async function loadSettings() {
      const s = await apiCall('getSettings', {});
      document.getElementById('logo-preview').src = s.school_logo_url || '';
      document.getElementById('school-name').value = s.school_name || '';
      document.getElementById('school-address').value = s.school_address || '';
      document.getElementById('app-title-input').value = s.app_title || '';
      document.getElementById('exam-title-input').value = s.exam_title || '';
      document.getElementById('theme-color').value = s.theme_color || '#2563eb';
      document.getElementById('kepsek-name').value = s.kepala_sekolah_name || '';
      document.getElementById('kepsek-nip').value = s.kepala_sekolah_nip || '';
    }

    async function saveSettings() {
      const logoFile = document.getElementById('logo-file').files[0];
      if (logoFile) {
        const base64 = await fileToBase64(logoFile);
        await apiCall('uploadImage', { base64, filename: logoFile.name, mimeType: logoFile.type })
          .then(up => apiCall('updateSettings', { updates: { school_logo_url: up.url } }));
      }
      await apiCall('updateSettings', {
        updates: {
          school_name: document.getElementById('school-name').value,
          school_address: document.getElementById('school-address').value,
          app_title: document.getElementById('app-title-input').value,
          exam_title: document.getElementById('exam-title-input').value,
          theme_color: document.getElementById('theme-color').value,
          kepala_sekolah_name: document.getElementById('kepsek-name').value,
          kepala_sekolah_nip: document.getElementById('kepsek-nip').value,
        }
      });
      document.getElementById('save-status').textContent = 'Tersimpan.';
      setTimeout(() => document.getElementById('save-status').textContent = '', 2000);
      loadBranding();
    }

    loadSettings();
  </script>
</body>
</html>
