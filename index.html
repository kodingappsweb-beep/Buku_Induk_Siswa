<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SI-BIS — Sistem Informasi Buku Induk Siswa v3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --sidebar-bg:#0f172a; --menu-aktif:#2563eb; --menu-hover:#1e293b; --konten-bg:#f8fafc;
  }
  *{font-family:'Inter',system-ui,sans-serif}
  body{background:var(--konten-bg)}
  .sidebar{background:var(--sidebar-bg)}
  .menu-item{transition:background .15s,color .15s}
  .menu-item:hover{background:var(--menu-hover);color:#fff}
  .menu-item.active{background:var(--menu-aktif);color:#fff}
  .konten{background:var(--konten-bg)}
  .logo-box{background:#fff;padding:6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
  .foto-bulat{width:40px;height:40px;border-radius:9999px;object-fit:cover;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#475569;font-size:14px;flex-shrink:0}
  .modal-bg{background:rgba(15,23,42,.55)}
  input[type=color]{width:44px;height:32px;border:none;background:none;cursor:pointer;padding:0}
  .tab-btn.active{border-bottom:2px solid var(--menu-aktif);color:var(--menu-aktif);font-weight:600}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

  /* --- cetak biodata / kop sekolah --- */
  .kop{display:flex;align-items:center;gap:16px}
  .kop-logo{width:3cm;height:3cm;object-fit:contain;background:#fff;padding:4px;border:1px solid #ccc}
  .kop-nama{font-size:16pt;font-weight:bold;text-transform:uppercase;text-align:center}
  .kop-identitas{flex:1;text-align:center;font-size:10pt}
  .kop-garis{border-top:3px solid #000;border-bottom:1px solid #000;height:2px;margin:6px 0 14px}
  .judul-cetak{text-align:center;text-transform:uppercase;text-decoration:underline;margin:10px 0 2px;font-size:13pt;font-weight:bold}
  .subjudul-cetak{text-align:center;margin-bottom:16px;font-size:11pt}
  .tgl-cetak{text-align:right;font-size:10pt}
  .foto-bingkai{float:right;width:3.2cm;height:4.5cm;border:1px solid #000;background:#fff;text-align:center;margin-left:12px}
  .foto-print{width:100%;height:4cm;object-fit:cover;background:#fff}
  .foto-label{font-size:8pt;border-top:1px solid #ccc;padding:2px}
  .foto-mini{width:1cm;height:1.3cm;object-fit:cover;background:#fff}
  table.bio{width:100%;border-collapse:collapse;margin-bottom:10px}
  table.bio td{border:none;padding:3px 6px;vertical-align:top;font-size:11pt}
  table.bio td:first-child,table.bio td:nth-child(3){width:32%}
  .seksi{font-weight:bold;text-transform:uppercase;margin:12px 0 4px;font-size:11pt;border-bottom:1px solid #000;padding-bottom:2px}
  .ttd-row{display:flex;justify-content:space-between;margin-top:1.5cm;text-align:center}
  .ttd{flex:1;font-size:11pt}
  .rekap-guru th,.rekap-guru td{border:1px solid #000;padding:5px 6px;font-size:9pt;vertical-align:middle;background:#fff;color:#000}
  .rekap-guru th{background:#eee!important;font-weight:bold}
  .biodata-siswa{overflow:hidden}

  @media print{
    html,body{background:#fff!important;color:#000!important;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .no-print{display:none!important}
    body.mode-print main, body.mode-print #loginScreen{display:none!important}
    #printContainer{display:block!important}
    aside,.sidebar,.konten,main,header.app-header{background:#fff!important;color:#000!important;box-shadow:none!important}
    .print-area{display:block!important;position:absolute;left:0;top:0;width:100%;margin:0;padding:1.5cm;background:#fff!important;box-shadow:none!important;color:#000!important}
    .logo-box,.foto-print,.kop-logo{background:#fff!important;padding:4px}
    .page-break{page-break-before:always}
    table{width:100%!important;border-collapse:collapse!important;background:#fff!important}
    th,td{border:1px solid #000!important;padding:6px 10px!important;font-size:10pt!important;background:#fff!important;color:#000!important}
    th{background:#eee!important;font-weight:bold}
    .print-hidden{display:none!important}
  }
</style>
</head>
<body class="text-slate-800">

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#0f172a,#1e3a8a)">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="flex flex-col items-center mb-6">
      <div class="logo-box w-20 h-20 mb-3 border border-slate-200" id="loginLogoBox">
        <i class="fa-solid fa-school text-4xl text-slate-400"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800" id="loginAppName">SI-BIS</h1>
      <p class="text-sm text-slate-500" id="loginSubtitle">Sistem Informasi Buku Induk Siswa v3</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input id="loginUser" type="text" placeholder="username" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" autofocus>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input id="loginPass" type="password" placeholder="password" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">URL Google Apps Script <span class="text-slate-400 font-normal">(untuk sinkronisasi cloud — cukup diisi sekali)</span></label>
        <input id="loginGasUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" oninput="if(this.value.trim()){try{localStorage.setItem(LS_GAS,this.value.trim());}catch(e){}}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none font-mono">
      </div>
      <button id="loginBtn" onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
      <p class="text-xs text-slate-400 text-center">Default: <b>admin</b> / <b>admin123</b></p><p class="text-[10px] text-slate-300 text-center mt-1">SI-BIS v3.1d</p>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden flex min-h-screen">
  <!-- SIDEBAR -->
  <aside class="sidebar w-64 text-slate-300 flex flex-col fixed h-screen no-print z-20" id="sidebar">
    <div class="p-4 border-b border-white/10 flex items-center gap-3">
      <div class="logo-box w-10 h-10" id="sideLogoBox"><i class="fa-solid fa-school text-slate-500"></i></div>
      <div><div class="font-bold text-white text-sm" id="sideAppName">SI-BIS</div><div class="text-[10px] text-slate-400">Buku Induk Siswa v3</div></div>
    </div>
    <!-- Filter global TA + Semester -->
    <div class="p-3 border-b border-white/10 space-y-2">
      <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Filter Aktif</div>
      <select id="filterTA" onchange="gantiFilter()" class="w-full px-2 py-1.5 rounded bg-white/10 text-white text-xs border border-white/20 outline-none"></select>
      <select id="filterSemester" onchange="gantiFilter()" class="w-full px-2 py-1.5 rounded bg-white/10 text-white text-xs border border-white/20 outline-none"></select>
    </div>
    <nav class="flex-1 overflow-y-auto py-2" id="menuNav"></nav>
    <div class="p-3 border-t border-white/10 text-[11px]">
      <div class="flex items-center gap-2 mb-1"><span id="syncDot" class="w-2 h-2 rounded-full bg-green-400 inline-block"></span><span id="syncText" class="text-slate-400">Tersimpan</span></div>
      <div class="flex items-center gap-1.5 mb-1 text-slate-300"><i class="fa-solid fa-user-circle text-slate-400"></i><span id="sideUser" class="truncate">—</span></div>
      <button onclick="logout()" class="text-slate-400 hover:text-white flex items-center gap-1.5"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </div>
  </aside>

  <!-- KONTEN -->
  <main class="konten flex-1 ml-64 min-h-screen">
    <header class="app-header bg-white shadow-sm px-6 py-3 flex items-center justify-between sticky top-0 z-10 no-print">
      <h2 class="text-lg font-bold text-slate-700" id="pageTitle">Dashboard</h2>
      <div class="flex items-center gap-3 text-sm text-slate-500">
        <i class="fa-solid fa-calendar-days"></i><span id="headerTA"></span>
      </div>
    </header>
    <div id="pageContent" class="p-6"></div>
  </main>
</div>

<!-- MODAL CONTAINER -->
<div id="printContainer" class="print-area" style="display:none"></div>
<div id="modalRoot"></div>
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-800 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm"></div>

<script>
/* ============================================================
   SI-BIS v3 — state & util
   ============================================================ */
let studentDb=[], guruDb=[], kelasDb=[], mapelDb=[], gradeDb={}, parameterDb={}, activeFilters={tahunAjaran:'',semester:''};
// ============================================================
// KONFIGURASI BACKEND — Tempel URL Web App Google Apps Script di bawah ini
// agar permanen (tidak perlu diisi saat login). Kosongkan untuk mode lokal.
// Contoh: "https://script.google.com/macros/s/AKfycbxXXXXXXX/exec"
const EMBEDDED_GAS_URL = "https://script.google.com/macros/s/AKfycbxn3S9w94XGOs1C3vQXZs3qA-w4Khm3rs-Dh7sGWtTHGVbNRueJx5jRUw_S19JO4xCo/exec"; // <===== ISI URL GAS DI SINI
// ============================================================
let GAS_URL=EMBEDDED_GAS_URL, currentMenu='dashboard', syncTimer=null, syncState='idle', currentUser=null;
const LS_KEY='sibis_v3_data', LS_GAS='sibis_gas_url';

const DEFAULT_MAPEL_SMP=[
  {id:'m-pai',kode:'pai',nama:'Pendidikan Agama Islam',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-pkn',kode:'pkn',nama:'Pendidikan Pancasila',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-bi',kode:'bi',nama:'Bahasa Indonesia',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-mtk',kode:'mtk',nama:'Matematika',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-ipa',kode:'ipa',nama:'Ilmu Pengetahuan Alam',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-ips',kode:'ips',nama:'Ilmu Pengetahuan Sosial',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-bing',kode:'bing',nama:'Bahasa Inggris',kelompok:'A',tingkat:'Semua',aktif:true},
  {id:'m-seni',kode:'seni',nama:'Seni Budaya',kelompok:'B',tingkat:'Semua',aktif:true},
  {id:'m-pjok',kode:'pjok',nama:'Pendidikan Jasmani',kelompok:'B',tingkat:'Semua',aktif:true},
  {id:'m-prak',kode:'prakarya',nama:'Prakarya',kelompok:'B',tingkat:'Semua',aktif:true},
];
const TEMA_DEFAULT={sidebarBg:'#0f172a',menuAktif:'#2563eb',menuHover:'#1e293b',kontenBg:'#f8fafc'};
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function tglID(iso){if(!iso)return'-';const d=new Date(iso);if(isNaN(d))return iso;return d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600);}
function inisial(nama){if(!nama)return'?';return nama.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function fotoEl(url,nama,size=40){
  if(url)return `<img src="${url}" class="foto-bulat" style="width:${size}px;height:${size}px">`;
  return `<span class="foto-bulat" style="width:${size}px;height:${size}px">${inisial(nama)}</span>`;
}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normJK(v){if(!v)return'';const s=String(v).toUpperCase();if(s[0]==='L')return'L';if(s[0]==='P')return'P';return'';}

/* ============================================================
   Login & data load
   ============================================================ */
async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const btnHTML=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';}
  try{
    const u=document.getElementById('loginUser').value.trim();
    const p=document.getElementById('loginPass').value;
    if(!u||!p){toast('Username dan password wajib diisi.');if(btn){btn.disabled=false;btn.innerHTML=btnHTML;}return;}
    try{GAS_URL=EMBEDDED_GAS_URL || (document.getElementById('loginGasUrl')||{}).value.trim() || localStorage.getItem(LS_GAS) || '';}catch(e){GAS_URL=EMBEDDED_GAS_URL||'';}
    if(GAS_URL){try{localStorage.setItem(LS_GAS, GAS_URL);}catch(e){}}
    await loadData();
    const user=(parameterDb.users||[]).find(x=>x.username===u && x.password===p);
    if(!user){toast('Username atau password salah.');if(btn){btn.disabled=false;btn.innerHTML=btnHTML;}return;}
    currentUser=user;
    // Set session marker LANGSUNG (paling andal) agar refresh tidak kembali ke login
    try{localStorage.setItem('sibis_auth','1');localStorage.setItem('sibis_session','1');}catch(e){}
    try{document.cookie='sibis_session=1;path=/;max-age=86400';}catch(e){}
    try{window.name='sibis_session=1';}catch(e){}
    try{if(location.hash.indexOf('sibis=1')<0)location.hash='sibis=1';}catch(e){}
    masukApp();
  }catch(e){
    console.error(e);toast('Gagal masuk: '+String(e.message||e));
    if(btn){btn.disabled=false;btn.innerHTML=btnHTML;}
  }
}
function masukApp(){
  terapkanTema();
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('app').classList.add('flex');
  buildMenu();renderAll();setSync('Tersimpan');
  const su=document.getElementById('sideUser');if(su)su.textContent=(currentUser?currentUser.nama||currentUser.username:'');
  try{localStorage.setItem('sibis_session','1');localStorage.setItem('sibis_auth','1');localStorage.setItem('sibis_user',JSON.stringify(currentUser||{}));}catch(e){}try{if(location.hash.indexOf('sibis=1')<0)location.hash='sibis=1';}catch(e){}try{document.cookie='sibis_session=1;path=/;max-age=86400';document.cookie='sibis_user='+encodeURIComponent(JSON.stringify(currentUser||{}))+';path=/;max-age=86400';}catch(e){}try{window.name='sibis_session=1';}catch(e){}try{if(location.hash.indexOf('sibis=1')<0)location.hash='sibis=1';}catch(e){}
}
async function autoLogin(){
  try{GAS_URL=EMBEDDED_GAS_URL || localStorage.getItem(LS_GAS) || '';}catch(e){GAS_URL=EMBEDDED_GAS_URL||'';}
  try{currentUser=JSON.parse(localStorage.getItem('sibis_user')||'null');}catch(e){currentUser=null;}if(!currentUser){try{const m=document.cookie.match(/sibis_user=([^;]+)/);if(m)currentUser=JSON.parse(decodeURIComponent(m[1]));}catch(e){}}if(!currentUser){currentUser=(parameterDb.users&&parameterDb.users[0])||{username:'admin',nama:'Admin'};}
  try{await loadData();}catch(e){console.warn('autoLogin loadData gagal:',e);}
  try{masukApp();}catch(e){console.error(e);}
}
function logout(){try{localStorage.removeItem('sibis_session');localStorage.removeItem('sibis_auth');localStorage.removeItem('sibis_user');}catch(e){}try{document.cookie='sibis_session=;path=/;max-age=0';document.cookie='sibis_user=;path=/;max-age=0';}catch(e){}try{window.name='';}catch(e){}try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}if(confirm('Keluar dari aplikasi? Data sudah tersimpan otomatis.'))location.reload();}

async function loadData(){
  // default parameter
  parameterDb={
    tahunAjaran:[(new Date().getMonth()<6?(new Date().getFullYear()-1)+'/'+new Date().getFullYear():new Date().getFullYear()+'/'+(new Date().getFullYear()+1))],
    semester:['Ganjil','Genap'],
    sekolah:{namaAplikasi:'SI-BIS',logo:'',namaSekolah:'',npsn:'',alamat:'',kota:'',tanggalCetak:'',kepalaSekolah:'',nipKepalaSekolah:''},
    tema:{...TEMA_DEFAULT},
    users:[{username:'admin',password:'admin123',nama:'Administrator',role:'Admin'}]
  };
  mapelDb=DEFAULT_MAPEL_SMP.map(m=>({...m}));
  if(GAS_URL){
    try{
      setSync('Menyambungkan...');
      const r=await fetch(GAS_URL,{method:'GET'});
      const data=await r.json();
      applyData(data);
    }catch(e){console.warn('GAS gagal, pakai localStorage:',e);toast('Gagal tersambung ke GAS, mode lokal aktif.');loadLocal();}
  }else{loadLocal();}
  if(!activeFilters.tahunAjaran)activeFilters.tahunAjaran=parameterDb.tahunAjaran[parameterDb.tahunAjaran.length-1]||'';
  if(!activeFilters.semester)activeFilters.semester=parameterDb.semester[0]||'Ganjil';
}
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);applyData(d);}}catch(e){}
}
function applyData(data){
  if(data.siswa)studentDb=data.siswa;
  if(data.guru)guruDb=data.guru;
  if(data.kelas)kelasDb=data.kelas;
  if(data.mapel&&data.mapel.length)mapelDb=data.mapel;
  if(data.nilai)gradeDb=data.nilai;
  if(data.parameter){
    if(data.parameter.tahunAjaran&&data.parameter.tahunAjaran.length)parameterDb.tahunAjaran=data.parameter.tahunAjaran;
    if(data.parameter.semester&&data.parameter.semester.length)parameterDb.semester=data.parameter.semester;
    if(data.parameter.sekolah)parameterDb.sekolah={...parameterDb.sekolah,...data.parameter.sekolah};
    if(data.parameter.tema)parameterDb.tema={...TEMA_DEFAULT,...data.parameter.tema};
    if(data.parameter.users&&data.parameter.users.length)parameterDb.users=data.parameter.users;
  }
}
function terapkanTema(){
  const t=parameterDb.tema||TEMA_DEFAULT;
  const r=document.documentElement.style;
  r.setProperty('--sidebar-bg',t.sidebarBg||TEMA_DEFAULT.sidebarBg);
  r.setProperty('--menu-aktif',t.menuAktif||TEMA_DEFAULT.menuAktif);
  r.setProperty('--menu-hover',t.menuHover||TEMA_DEFAULT.menuHover);
  r.setProperty('--konten-bg',t.kontenBg||TEMA_DEFAULT.kontenBg);
  // logo preview
  const logo=parameterDb.sekolah&&parameterDb.sekolah.logo;
  ['loginLogoBox','sideLogoBox'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.innerHTML=logo?`<img src="${logo}" class="w-full h-full object-contain rounded" style="background:#fff">`:'<i class="fa-solid fa-school text-2xl text-slate-400"></i>';
  });
  document.getElementById('loginAppName').textContent=(parameterDb.sekolah&&parameterDb.sekolah.namaAplikasi)||'SI-BIS';
  document.getElementById('sideAppName').textContent=(parameterDb.sekolah&&parameterDb.sekolah.namaAplikasi)||'SI-BIS';
  const sub=document.getElementById('loginSubtitle');if(sub){const sk=parameterDb.sekolah||{};if(sk.namaSekolah)sub.textContent=sk.namaSekolah+(sk.npsn?' · NPSN '+sk.npsn:'');}
  // Simpan identitas ke key kecil khusus (agar tampil di login saat halaman dibuka)
  try{localStorage.setItem('sibis_id',JSON.stringify({logo:logo||'',namaAplikasi:(parameterDb.sekolah&&parameterDb.sekolah.namaAplikasi)||'',namaSekolah:(parameterDb.sekolah&&parameterDb.sekolah.namaSekolah)||'',npsn:(parameterDb.sekolah&&parameterDb.sekolah.npsn)||''}));}catch(e){}
}

/* ============================================================
   Save (debounce) + GAS + localStorage
   ============================================================ */
function setSync(txt){
  const dot=document.getElementById('syncDot'),tx=document.getElementById('syncText');
  if(txt==='Tersimpan'){dot.className='w-2 h-2 rounded-full bg-green-400 inline-block';tx.textContent='Tersimpan';}
  else{dot.className='w-2 h-2 rounded-full bg-yellow-400 inline-block animate-pulse';tx.textContent=txt;}
}
function saveData(){
  setSync('Menyinkronkan...');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    const _forceStr=(o,keys)=>{keys.forEach(k=>{if(o[k]!==undefined&&o[k]!==null)o[k]=String(o[k]);});};
  studentDb.forEach(s=>_forceStr(s,['nis','nisn','nik','noHp']));
  guruDb.forEach(g=>_forceStr(g,['nip','nik','noHp']));
  const payload={siswa:studentDb,guru:guruDb,kelas:kelasDb,mapel:mapelDb,nilai:gradeDb,parameter:parameterDb};
    localStorage.setItem(LS_KEY,JSON.stringify(payload));
    if(GAS_URL){
      try{await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload)});setSync('Tersimpan');}
      catch(e){setSync('Offline (tersimpan lokal)');}
    }else setSync('Tersimpan (lokal)');
  },1200);
}

/* ============================================================
   Upload foto (kompres canvas → GAS uploadFile)
   ============================================================ */
function kompresGambar(file,maxW=480){
  return new Promise((res,rej)=>{
    if(file.size>2*1024*1024){rej(new Error('Ukuran file melebihi batas maksimal 2 MB.'));return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const w=Math.min(img.width,maxW);const h=Math.round(img.height*(w/img.width));
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',0.8));
      };
      img.onerror=()=>rej(new Error('Gagal membaca gambar.'));
      img.src=e.target.result;
    };
    reader.onerror=()=>rej(new Error('Gagal membaca file.'));
    reader.readAsDataURL(file);
  });
}
async function uploadFoto(file,jenis,oldUrl){
  const b64=await kompresGambar(file,jenis==='logo'?256:480);
  const oldId=oldUrl&&oldUrl.includes('/d/')?oldUrl.split('/d/')[1].split(/[?/]/)[0]:'';
  if(!GAS_URL){toast('Mode lokal: foto disimpan sebagai data (tanpa GAS).');return{ok:true,url:b64,id:'local'};}
  const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'upload',base64:b64,filename:jenis+'_'+Date.now()+'.jpg',jenis,oldId})});
  return r.json();
}
function bindFotoInput(inputId,previewId,jenis,cb){
  document.getElementById(inputId).addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const old=document.getElementById(previewId).dataset.url||'';
      const res=await uploadFoto(f,jenis,old);
      if(res.ok){document.getElementById(previewId).dataset.url=res.url;document.getElementById(previewId).innerHTML=`<img src="${res.url}" class="w-full h-full object-cover rounded" style="background:#fff">`;cb&&cb(res.url);}
      else toast(res.error||'Gagal upload foto.');
    }catch(err){toast(err.message);}
  });
}

function simpanMapel(id){
  const kode=v('mp_kode').trim().toLowerCase(),nama=v('mp_nama').trim();
  if(!kode||!nama){toast('Kode dan nama mapel wajib diisi.');return;}
  if(mapelDb.some(m=>m.kode===kode&&m.id!==id)){toast('Kode mapel sudah ada.');return;}
  const data={kode,nama,kelompok:v('mp_kel'),tingkat:v('mp_ting'),aktif:true};
  if(id){const i=mapelDb.findIndex(x=>x.id===id);mapelDb[i]={...mapelDb[i],...data};}
  else{data.id=uid('mpl');mapelDb.push(data);}
  closeModal();saveData();renderAll();toast('Mapel tersimpan.');
}
function hapusMapel(id){if(confirm('Hapus mapel ini? Kolom nilai terkait akan tetap ada di data.')){mapelDb=mapelDb.filter(m=>m.id!==id);saveData();renderAll();}}

let nilaiState={kelasId:'',cari:'',siswaId:'',semester:''};

function rNilai(c){

  <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex flex-wrap gap-3 items-center no-print">
    <select onchange="nilaiState.kelasId=this.value;nilaiState.siswaId='';rNilai(document.getElementById('pageContent'))" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white outline-none">

      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>

    <button onclick="document.getElementById('importNilai').click()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-2"><i class="fa-solid fa-file-import"></i>Import</button>
    <input type="file" id="importNilai" class="hidden" accept=".csv,.xlsx,.xls" onchange="importData('nilai',this)">
    ${siswa?`<button onclick="cetakRapor()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-2"><i class="fa-solid fa-print"></i>Cetak Rapor</button>`:''}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white rounded-xl shadow-sm p-3 max-h-[70vh] overflow-y-auto">

      <div class="space-y-1 mt-2" id="nilaiSiswaList">${siswaList||'<div class="text-center text-slate-400 text-sm py-8">Tidak ada siswa.</div>'}</div>

    <div class="md:col-span-2 bg-white rounded-xl shadow-sm p-5">
      ${siswa?`
        <div class="flex items-center gap-3 pb-4 border-b border-slate-200 mb-4">

          <div><div class="font-bold text-slate-800">${escapeHtml(siswa.nama)}</div><div class="text-xs text-slate-500">NIS: ${siswa.nis||'-'} · ${namaKelas(siswa.kelasAktifId)} · Semester ${nilaiState.semester} · TA ${activeFilters.tahunAjaran}</div></div>
        </div>
        <table class="w-full text-sm mb-4"><thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="py-2 px-3 text-left w-20">Kode</th><th class="py-2 px-3 text-left">Mata Pelajaran</th><th class="py-2 px-3 text-center">Nilai (0-100)</th></tr></thead>

function buildNilaiSiswaList(){
  return siswaAktif().filter(s=>!nilaiState.kelasId||s.kelasAktifId===nilaiState.kelasId).filter(s=>!nilaiState.cari||s.nama.toLowerCase().includes(nilaiState.cari.toLowerCase())).map(s=>`<button onclick="pilihSiswaNilai('${s.id}')" class="w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2 hover:bg-slate-100 ${nilaiState.siswaId===s.id?'bg-blue-50 border border-blue-200':''}">${fotoEl(s.foto,s.nama,32)}<span class="flex-1 truncate">${escapeHtml(s.nama)}</span><span class="text-xs text-slate-400">${s.nis||''}</span></button>`).join('');
}
function updateNilaiList(inp){
  if(inp)nilaiState.cari=inp.value;
  const el=document.getElementById('nilaiSiswaList');
  if(el)el.innerHTML=buildNilaiSiswaList()||'<div class="text-center text-slate-400 text-sm py-8">Tidak ada siswa.</div>';

function pilihSiswaNilai(id){nilaiState.siswaId=id;rNilai(document.getElementById('pageContent'));}
function simpanNilai(nis){
  const key=nis+'_'+nilaiState.semester;
  const obj={};let ada=false;
  document.querySelectorAll('.nilaiInp').forEach(inp=>{const val=inp.value.trim();if(val!==''){obj[inp.dataset.kode]=Number(val);ada=true;}});
  if(ada)gradeDb[key]=obj;else delete gradeDb[key];
  saveData();toast('Nilai tersimpan.');rNilai(document.getElementById('pageContent'));
}
function cetakRapor(){
  const siswa=studentDb.find(s=>s.id===nilaiState.siswaId);if(!siswa)return;
  const mapels=mapelAktifUntukKelas(siswa.kelasAktifId);

    <script>window.print();<\/script></body></html>`);

function simpanUser(i){
  const username=v('u_user').trim(),password=v('u_pass');
  if(!username||!password){toast('Username dan password wajib diisi.');return;}
  if(parameterDb.users.some((u,idx)=>u.username===username && idx!==i)){toast('Username sudah dipakai.');return;}
  const data={username,password,nama:v('u_nama').trim(),role:v('u_role')};
  if(i>=0)parameterDb.users[i]=data;else parameterDb.users.push(data);
  closeModal();saveData();renderAll();toast('User tersimpan.');
}
function hapusUser(i){
  if(parameterDb.users.length<=1){toast('Minimal 1 user harus tersisa.');return;}
  if(confirm('Hapus user ini?')){parameterDb.users.splice(i,1);saveData();renderAll();toast('User dihapus.');}
}

let CODE_GS_CACHE=JSON.parse("/**\n * Code.gs \u2014 Backend SI-BIS (Buku Induk Siswa) v3.1 untuk Google Sheets + Google Drive\n *\n * Perbaikan v3.1:\n *  - Provisioning folder Drive HANYA SEKALI (cache ScriptProperties + cari folder\n *    berdasarkan nama, reuse jika sudah ada). saveData/upload TIDAK pernah membuat\n *    folder baru lagi \u2192 tidak ada duplikasi folder setiap edit data.\n *  - saveData tidak memanggil provision_() lagi (hanya ensureSheets_ yang murah).\n *  - Parameter users (manajemen user login) ikut disimpan & dipreserve.\n *  - Semua kunci tidak-terkelola di Parameter (folder.*, users, dll) di-preserve.\n *\n * Cara pasang:\n *  1. Buat Google Sheets baru \u2192 Extensions \u2192 Apps Script \u2192 tempel file ini \u2192 simpan\n *  2. Deploy \u2192 New deployment \u2192 Web app: Execute as Me, Who has access Anyone \u2192 Deploy\n *  3. Tempel URL /exec ke konstanta GAS_URL di si-bis-v3.html.\n *  Setelah update: Manage deployments \u2192 Edit \u2192 New version agar aktif.\n */\n\nconst SHEET_SISWA = 'Siswa', SHEET_GURU = 'Guru', SHEET_KELAS = 'Kelas',\n      SHEET_MAPEL = 'Mapel', SHEET_NILAI = 'Nilai', SHEET_PARAM = 'Parameter';\n\nconst SISWA_COLS = ['id','nama','nis','nisn','nik','jk','agama','statusKel','anakKe',\n  'tempatLahir','tglLahir','alamat','noHp','sekolahAsal','kelasDiterima','kelasAktifId',\n  'tglDiterima','namaAyah','pekerjaanAyah','namaIbu','pekerjaanIbu','alamatOrtu',\n  'namaWali','pekerjaanWali','alamatWali','foto','tahunAjaran','statusAkhir',\n  'tglKeluar','alasanKeluar'];\n\nconst GURU_COLS = ['id','nip','nik','nama','jk','alamat','noHp','mapelDiampu','status','foto'];\nconst KELAS_COLS = ['id','namaKelas','tingkat','tahunAjaran','waliKelasId','ruangan'];\nconst MAPEL_COLS = ['id','kode','nama','kelompok','tingkat','aktif'];\nconst SEKOLAH_KEYS = ['namaAplikasi','logo','namaSekolah','npsn','alamat','kota','tanggalCetak','kepalaSekolah','nipKepalaSekolah'];\n\nconst TEMA_DEFAULTS = { sidebarBg:'#0f172a', menuAktif:'#2563eb', menuHover:'#1e293b', kontenBg:'#f8fafc' };\nconst MAX_FILE_BYTES = 2 * 1024 * 1024; // 2 MB\n\n/* ------------------------------------------------------------------ */\n/* Util sheet                                                          */\n/* ------------------------------------------------------------------ */\nfunction getSheet_(name, headerCols) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); if (headerCols) sh.appendRow(headerCols); }\n  else if (headerCols && sh.getLastRow() === 0) { sh.appendRow(headerCols); }\n  return sh;\n}\nfunction ensureSheets_() {\n  getSheet_(SHEET_SISWA, SISWA_COLS); getSheet_(SHEET_GURU, GURU_COLS);\n  getSheet_(SHEET_KELAS, KELAS_COLS); getSheet_(SHEET_MAPEL, MAPEL_COLS);\n  getSheet_(SHEET_NILAI, ['key','nis','semester']); getSheet_(SHEET_PARAM, ['kunci','nilai']);\n}\nfunction sheetToObjects_(sh) {\n  const values = sh.getDataRange().getValues();\n  if (values.length < 2) return [];\n  const header = values[0].map(h => String(h).trim());\n  return values.slice(1).map(row => {\n    const o = {};\n    header.forEach((h, i) => { o[h] = row[i] === undefined ? '' : row[i]; });\n    return o;\n  });\n}\nfunction readParamMap_() {\n  const sh = getSheet_(SHEET_PARAM, ['kunci','nilai']);\n  const vals = sh.getDataRange().getValues();\n  const m = {};\n  for (let i = 1; i < vals.length; i++) {\n    if (vals[i][0] !== '' && vals[i][0] != null) m[String(vals[i][0]).trim()] = vals[i][1];\n  }\n  return m;\n}\nfunction writeParam_(kunci, nilai) {\n  const sh = getSheet_(SHEET_PARAM, ['kunci','nilai']);\n  const vals = sh.getDataRange().getValues();\n  for (let i = 1; i < vals.length; i++) {\n    if (String(vals[i][0]).trim() === kunci) { sh.getRange(i + 1, 2).setValue(nilai); return; }\n  }\n  sh.appendRow([kunci, nilai]);\n}\nfunction folderExists_(id) {\n  if (!id) return false;\n  try { DriveApp.getFolderById(id); return true; } catch (e) { return false; }\n}\n\n/* ------------------------------------------------------------------ */\n/* Auto-provisioning \u2014 HANYA SEKALI (cache ScriptProperties)           */\n/* ------------------------------------------------------------------ */\nfunction defaultTahunAjaran_() {\n  const now = new Date(); const y = now.getFullYear();\n  return (now.getMonth() < 6) ? [(y - 1) + '/' + y] : [y + '/' + (y + 1)];\n}\nfunction ensureDefaults_() {\n  const p = readParamMap_();\n  if (!p['tahunAjaran']) writeParam_('tahunAjaran', JSON.stringify(defaultTahunAjaran_()));\n  if (!p['semester'])    writeParam_('semester', JSON.stringify(['Ganjil','Genap']));\n  if (!p['tema'])        writeParam_('tema', JSON.stringify(TEMA_DEFAULTS));\n  if (!p['users'])       writeParam_('users', JSON.stringify([{username:'admin',password:'admin123',nama:'Administrator',role:'Admin'}]));\n}\n\n/**\n * Pastikan folder Drive ada. VERIFIKASI ID folder benar-benar tersimpan di sheet\n * Parameter & valid (bukan hanya andalkan flag cache). Jika ada yang hilang/tidak\n * valid, provision ulang otomatis (cari by name \u2192 reuse, tidak duplikat).\n */\nfunction ensureDriveFolder_() {\n  const props = PropertiesService.getScriptProperties();\n  const p = readParamMap_();\n  const keys = ['folder.root','folder.logo','folder.foto_siswa','folder.foto_guru'];\n  const semuaAda = keys.every(k => p[k] && folderExists_(p[k]));\n  if (semuaAda && props.getProperty('sibis_provisioned') === '1') return p;\n  try { props.deleteProperty('sibis_provisioned'); } catch(e) {}\n  const nama = p['sekolah.namaSekolah'] || p['sekolah.namaAplikasi'] || 'SI-BIS';\n  const rootName = 'SI-BIS - ' + nama;\n  let root;\n  const rootIt = DriveApp.getRootFolder().getFoldersByName(rootName);\n  if (rootIt.hasNext()) { root = rootIt.next(); }\n  else { root = DriveApp.createFolder(rootName); }\n  writeParam_('folder.root', root.getId());\n  const subs = { logo:'logo', foto_siswa:'foto_siswa', foto_guru:'foto_guru' };\n  Object.keys(subs).forEach(key => {\n    const paramKey = 'folder.' + key;\n    let f;\n    const it = root.getFoldersByName(subs[key]);\n    if (it.hasNext()) f = it.next(); else f = root.createFolder(subs[key]);\n    writeParam_(paramKey, f.getId());\n  });\n  props.setProperty('sibis_provisioned', '1');\n  return readParamMap_();\n}\nfunction provision_() {\n  ensureSheets_();\n  ensureDefaults_();\n  ensureDriveFolder_();\n}\n\n/* ------------------------------------------------------------------ */\n/* Upload foto/logo \u2014 TIDAK membuat folder (folder sudah pasti ada)    */\n/* ------------------------------------------------------------------ */\nfunction uploadFile(p) {\n  try {\n    ensureSheets_();\n    ensureDriveFolder_(); // pastikan folder Drive siap (skip jika sudah, auto-recover jika ID hilang)\n    const params = readParamMap_();\n    const jenis = (p && (p.jenis === 'logo' || p.jenis === 'siswa' || p.jenis === 'guru')) ? p.jenis : 'siswa';\n    const folderKey = 'folder.' + (jenis === 'logo' ? 'logo' : (jenis === 'siswa' ? 'foto_siswa' : 'foto_guru'));\n    const folderId = params[folderKey];\n    if (!folderId) return { ok:false, error:'Folder penyimpanan belum tersedia \u2014 muat ulang aplikasi (login ulang) agar folder dibuat otomatis.' };\n\n    let b64 = String(p.base64 || '');\n    const match = b64.match(/^data:([^;]+);base64,(.*)$/);\n    let mime = 'image/jpeg', data = b64;\n    if (match) { mime = match[1]; data = match[2]; }\n    const bytes = Utilities.base64Decode(data);\n    if (bytes.length > MAX_FILE_BYTES) return { ok:false, error:'Ukuran file melebihi batas maksimal 2 MB.' };\n    if (bytes.length === 0) return { ok:false, error:'File kosong' };\n    const ext = (mime === 'image/png') ? '.png' : (mime === 'image/webp') ? '.webp' : '.jpg';\n    const fname = (p.filename || (jenis + '_' + Date.now())).replace(/\\.(png|jpg|jpeg|webp)$/i, '') + ext;\n    const blob = Utilities.newBlob(bytes, mime, fname);\n    const file = DriveApp.getFolderById(folderId).createFile(blob);\n    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n    if (p.oldId) { try { DriveApp.getFileById(p.oldId).setTrashed(true); } catch (e) {} }\n    const id = file.getId();\n    return { ok:true, id:id, url:'https://lh3.googleusercontent.com/d/' + id, nama:file.getName() };\n  } catch (e) {\n    return { ok:false, error:String(e && e.message ? e.message : e) };\n  }\n}\n\n/* ------------------------------------------------------------------ */\n/* Load data (dipanggil saat login / doGet) \u2014 provision boleh di sini  */\n/* ------------------------------------------------------------------ */\nfunction loadData() {\n  provision_(); // hanya saat load (login), cached setelahnya\n  const siswa = sheetToObjects_(getSheet_(SHEET_SISWA));\n  const guru  = sheetToObjects_(getSheet_(SHEET_GURU)).map(g => {\n    if (g.mapelDiampu) { try { g.mapelDiampu = JSON.parse(g.mapelDiampu); }\n      catch (e) { g.mapelDiampu = String(g.mapelDiampu).split(',').map(s=>s.trim()).filter(Boolean); } }\n    else g.mapelDiampu = [];\n    return g;\n  });\n  const kelas = sheetToObjects_(getSheet_(SHEET_KELAS));\n  const mapel = sheetToObjects_(getSheet_(SHEET_MAPEL)).map(m => ({\n    ...m, aktif: String(m.aktif).toLowerCase() !== 'false' && m.aktif !== '' && m.aktif !== false\n  }));\n  const shN = getSheet_(SHEET_NILAI);\n  const nVals = shN.getDataRange().getValues();\n  const nilai = {};\n  if (nVals.length >= 2) {\n    const nHeader = nVals[0].map(h => String(h).trim());\n    nVals.slice(1).forEach(row => {\n      const key = row[0] || (row[1] + '_' + row[2]);\n      nilai[key] = {};\n      nHeader.slice(3).forEach((k, i) => {\n        const v = row[i + 3];\n        nilai[key][k] = (v === '' || v == null) ? null : Number(v);\n      });\n    });\n  }\n  const paramRows = sheetToObjects_(getSheet_(SHEET_PARAM));\n  const parameter = { tahunAjaran:[], semester:[], sekolah:{}, tema:{}, users:[] };\n  paramRows.forEach(r => {\n    if (r.kunci === 'tahunAjaran') parameter.tahunAjaran = JSON.parse(r.nilai || '[]');\n    else if (r.kunci === 'semester') parameter.semester = JSON.parse(r.nilai || '[\"Ganjil\",\"Genap\"]');\n    else if (r.kunci === 'tema') parameter.tema = Object.assign({}, TEMA_DEFAULTS, JSON.parse(r.nilai || '{}'));\n    else if (r.kunci === 'users') { try { parameter.users = JSON.parse(r.nilai || '[]'); } catch(e){ parameter.users = []; } }\n    else if (r.kunci && r.kunci.indexOf('sekolah.') === 0) parameter.sekolah[r.kunci.split('.')[1]] = r.nilai;\n  });\n  if (!parameter.tema || Object.keys(parameter.tema).length === 0) parameter.tema = Object.assign({}, TEMA_DEFAULTS);\n  if (parameter.tahunAjaran.length === 0) parameter.tahunAjaran = defaultTahunAjaran_();\n  if (!parameter.users || parameter.users.length === 0) parameter.users = [{username:'admin',password:'admin123',nama:'Administrator',role:'Admin'}];\n  return { siswa, guru, kelas, mapel, nilai, parameter };\n}\n\n/* ------------------------------------------------------------------ */\n/* Save data \u2014 TIDAK memanggil provision_ (tidak sentuh Drive folder)  */\n/* Semua kunci tidak-terkelola (folder.*, users, dll) di-preserve.     */\n/* ------------------------------------------------------------------ */\nfunction saveData(p) {\n  ensureSheets_(); // murah & idempotent, TIDAK buat folder\n  const existingParams = readParamMap_(); // baca dulu folder.*, users, dll\n\n  const wr = (name, cols, rows, textCols) => {\n    const sh = getSheet_(name);\n    sh.clearContents().appendRow(cols);\n    (rows || []).forEach(r => sh.appendRow(cols.map(c => {\n      const v = r[c];\n      if (v === undefined || v === null) return '';\n      return Array.isArray(v) ? JSON.stringify(v) : v;\n    })));\n    // Paksa TEKS: set format @ + tulis ulang kolom tertentu sebagai STRING eksplisit\n    // (ini satu-satunya cara andal agar angka nol di awal NISN/NIK/NIS/No HP/NIP tidak hilang)\n    if (textCols && rows && rows.length) {\n      textCols.forEach(col => {\n        const colName = cols[col - 1];\n        const rng = sh.getRange(2, col, rows.length, 1);\n        rng.setNumberFormat('@');\n        rng.setValues(rows.map(r => [String(r[colName] == null ? '' : r[colName])]));\n      });\n    }\n  };\n  // Kolom (1-indexed): Siswa \u2192 nis=3, nisn=4, nik=5, noHp=13. Guru \u2192 nip=2, nik=3, noHp=7.\n  wr(SHEET_SISWA, SISWA_COLS, p.siswa, [3,4,5,13]);\n  wr(SHEET_GURU, GURU_COLS, p.guru, [2,3,7]);\n  wr(SHEET_KELAS, KELAS_COLS, p.kelas);\n  wr(SHEET_MAPEL, MAPEL_COLS, p.mapel);\n\n  const mapelKodes = (p.mapel || []).map(m => m.kode);\n  const nCols = ['key','nis','semester'].concat(mapelKodes);\n  const shN = getSheet_(SHEET_NILAI);\n  shN.clearContents().appendRow(nCols);\n  Object.keys(p.nilai || {}).forEach(key => {\n    const parts = key.split('_');\n    const nis = parts[0], semester = parts.slice(1).join('_');\n    const row = p.nilai[key];\n    shN.appendRow([key, nis, semester].concat(mapelKodes.map(k => (row[k] == null) ? '' : row[k])));\n  });\n\n  const shP = getSheet_(SHEET_PARAM);\n  shP.clearContents().appendRow(['kunci','nilai']);\n  shP.appendRow(['tahunAjaran', JSON.stringify(p.parameter.tahunAjaran || [])]);\n  shP.appendRow(['semester', JSON.stringify(p.parameter.semester || ['Ganjil','Genap'])]);\n  shP.appendRow(['tema', JSON.stringify(Object.assign({}, TEMA_DEFAULTS, p.parameter.tema || {}))]);\n  if (p.parameter.users && p.parameter.users.length) shP.appendRow(['users', JSON.stringify(p.parameter.users)]);\n  const sk = p.parameter.sekolah || {};\n  SEKOLAH_KEYS.forEach(k => { if (sk[k] !== undefined) shP.appendRow(['sekolah.' + k, sk[k]]); });\n  // Preserve SEMUA kunci tidak-terkelola (folder.*, dan lainnya) agar tidak hilang\n  const managed = {tahunAjaran:1, semester:1, tema:1, users:1};\n  Object.keys(existingParams).forEach(k => {\n    if (managed[k]) return;\n    if (k.indexOf('sekolah.') === 0) return;\n    shP.appendRow([k, existingParams[k]]); // folder.*, dan kunci lain \u2192 aman\n  });\n  return { ok:true, ts:new Date().toISOString() };\n}\n\n/* ------------------------------------------------------------------ */\n/* Web app entry points                                                */\n/* ------------------------------------------------------------------ */\nfunction doGet(e) { return json_(loadData()); }\nfunction doPost(e) {\n  let payload;\n  try { payload = JSON.parse(e.postData.contents); }\n  catch (err) { return json_({ ok:false, error:'invalid JSON' }); }\n  if (payload && payload.action === 'upload') return json_(uploadFile(payload));\n  return json_(saveData(payload)); // saveData TIDAK buat folder\n}\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n");

function exportJSON(){
  const payload={siswa:studentDb,guru:guruDb,kelas:kelasDb,mapel:mapelDb,nilai:gradeDb,parameter:parameterDb};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='si-bis-backup-'+Date.now()+'.json';a.click();
  toast('Backup JSON diunduh.');
}

function downloadTemplate(jenis){
  let headers,rows=[],fname;
  if(jenis==='siswa'){headers=['nama','jk','nis','nisn','nik','agama','tempatLahir','tglLahir','alamat','noHp','kelasAktifId','namaAyah','namaIbu','pekerjaanAyah','pekerjaanIbu','alamatOrtu','sekolahAsal','tglDiterima'];rows=[{nama:'Contoh Siswa',jk:'L',nis:'',nisn:'0012345678',nik:'3201010101010001',agama:'Islam',tempatLahir:'Bandung',tglLahir:'2010-05-15',alamat:'Jl. Contoh No.1',noHp:'081234567890',kelasAktifId:'',namaAyah:'Ayah Contoh',namaIbu:'Ibu Contoh',pekerjaanAyah:'PNS',pekerjaanIbu:'IRT',alamatOrtu:'Jl. Contoh No.1',sekolahAsal:'SDN Contoh',tglDiterima:'2023-07-10'}];fname='template-siswa';}
  else if(jenis==='guru'){headers=['nip','nik','nama','jk','alamat','noHp','mapelDiampu','status'];rows=[{nip:'',nik:'3201010101010002',nama:'Contoh Guru',jk:'P',alamat:'Jl. Contoh',noHp:'08123456789',mapelDiampu:'mtk,bi',status:'Aktif'}];fname='template-guru';}
  else{const mapelKodes=mapelDb.filter(m=>m.aktif!==false).map(m=>m.kode);headers=['key','nis','semester',...mapelKodes];rows=[{key:'nis123_Ganjil',nis:'nis123',semester:'Ganjil',...Object.fromEntries(mapelKodes.map(k=>[k,'']))}];fname='template-nilai';}
  const ws=XLSX.utils.json_to_sheet(rows,{header:headers});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,jenis);
  XLSX.writeFile(wb,fname+'.xlsx');
  toast('Template diunduh. Isi lalu import kembali.');
}
function importData(jenis,inputEl){
  const f=inputEl.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
      let ok=0,gagal=0;
      rows.forEach(r=>{
        if(jenis==='siswa'){
          const nama=String(r.nama||'').trim(),jk=normJK(r.jk);
          if(!nama||!jk){gagal++;return;}
          const data={id:uid('std'),nama,jk,nis:String(r.nis||'')||('N'+Date.now().toString(36).slice(-5).toUpperCase()),nisn:String(r.nisn||''),nik:String(r.nik||''),agama:r.agama||'',tempatLahir:r.tempatLahir||'',tglLahir:r.tglLahir||'',alamat:r.alamat||'',noHp:r.noHp||'',kelasAktifId:resolveKelasId(r.kelasAktifId||r.kelas||''),namaAyah:r.namaAyah||'',namaIbu:r.namaIbu||'',pekerjaanAyah:r.pekerjaanAyah||'',pekerjaanIbu:r.pekerjaanIbu||'',alamatOrtu:r.alamatOrtu||'',sekolahAsal:r.sekolahAsal||'',tglDiterima:r.tglDiterima||'',foto:'',statusAkhir:'Aktif',tahunAjaran:activeFilters.tahunAjaran};
          if(!studentDb.some(s=>s.nis===data.nis)){studentDb.push(data);ok++;}else gagal++;
        }else if(jenis==='guru'){
          const nama=String(r.nama||'').trim(),jk=normJK(r.jk);
          if(!nama||!jk){gagal++;return;}
          const mapelDiampu=String(r.mapelDiampu||'').split(',').map(s=>s.trim()).filter(Boolean);
          guruDb.push({id:uid('gur'),nip:String(r.nip||''),nik:String(r.nik||''),nama,jk,alamat:r.alamat||'',noHp:r.noHp||'',mapelDiampu,status:r.status||'Aktif',foto:''});ok++;
        }else{
          const nis=String(r.nis||''),semester=String(r.semester||'');
          if(!nis||!semester){gagal++;return;}
          const key=nis+'_'+semester;const obj={};
          mapelDb.filter(m=>m.aktif!==false).forEach(m=>{if(r[m.kode]!==''&&r[m.kode]!=null)obj[m.kode]=Number(r[m.kode]);});
          gradeDb[key]={...(gradeDb[key]||{}),...obj};ok++;
        }
      });
      saveData();renderAll();toast(`Import selesai: ${ok} berhasil, ${gagal} dilewati.`);
    }catch(err){toast('Gagal membaca file: '+err.message);}
    inputEl.value='';
  };
  reader.readAsArrayBuffer(f);
}

function dash(v){return (v===undefined||v===null||String(v).trim()==='')?'-':String(v);}
function jkLengkap(jk){return jk==='P'?'Perempuan':'Laki-laki';}
function mapelNama(kode){const m=mapelDb.find(x=>x.kode===kode);return m?m.nama:dash(kode);}
function tanggalCetak(){const s=parameterDb.sekolah||{};const kota=(s.kota?String(s.kota).trim():'');let d=new Date();if(s.tanggalCetak){const p=String(s.tanggalCetak).split('-');if(p.length===3)d=new Date(+p[0],+p[1]-1,+p[2]);}return (kota?kota+', ':'')+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear();}
function kopHTML(){
  const s=parameterDb.sekolah||{};

  if(s.alamat)lines.push(s.alamat);
  if(s.npsn)lines.push('NPSN: '+s.npsn);
  return `<div class="kop">${logo}<div class="kop-identitas"><div class="kop-nama">${dash(s.namaSekolah)}</div>${lines.map(l=>`<div>${l}</div>`).join('')}</div></div><div class="kop-garis"></div>`;
}

(function init(){
  function terapkanIdentitasLogin(sk){
    if(!sk)return;
    try{
      if(sk.logo){const el=document.getElementById('loginLogoBox');if(el)el.innerHTML='<img src="'+sk.logo+'" class="w-full h-full object-contain rounded" style="background:#fff">';}
      if(sk.namaAplikasi){const el=document.getElementById('loginAppName');if(el)el.textContent=sk.namaAplikasi;}
      if(sk.namaSekolah){const el=document.getElementById('loginSubtitle');if(el)el.textContent=sk.namaSekolah+(sk.npsn?' · NPSN '+sk.npsn:'');}
    }catch(e){}
  }
  const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  // 1) Terapkan branding SEGERA dari penyimpanan lokal (tanpa tunggu server)
  try{const id=lsGet('sibis_id');if(id)terapkanIdentitasLogin(JSON.parse(id));}catch(e){}
  try{const raw=lsGet(LS_KEY);if(raw)terapkanIdentitasLogin((JSON.parse(raw).parameter&&JSON.parse(raw).parameter.sekolah)||{});}catch(e){}
  // 2) URL GAS: embedded (paling andal) > tersimpan di browser. Pre-fill form login.
  let gasUrl='';
  try{gasUrl=EMBEDDED_GAS_URL||lsGet(LS_GAS)||'';}catch(e){gasUrl=EMBEDDED_GAS_URL||'';}
  try{const g=document.getElementById('loginGasUrl');if(g)g.value=gasUrl;}catch(e){}
  // 3) Ambil branding TERBARU dari server (agar selalu sesuai pengaturan di aplikasi)
  if(gasUrl){
    try{
      fetch(gasUrl+(gasUrl.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{method:'GET'})
        .then(r=>r.json())
        .then(d=>{const sk=(d.parameter&&d.parameter.sekolah)||{};terapkanIdentitasLogin(sk);lsSet('sibis_id',JSON.stringify(sk));})
        .catch(function(){});
    }catch(e){}
  }
  // 4) Retry branding (jika fetch selesai setelah render)
  setTimeout(function(){try{const id=lsGet('sibis_id');if(id)terapkanIdentitasLogin(JSON.parse(id));}catch(e){}},1000);
  // 5) Cek sesi — JIKA SUDAH LOGIN, langsung tampilkan app (refresh TIDAK balik ke login)
  let sesi=false;
  try{sesi=lsGet('sibis_auth')==='1'||lsGet('sibis_session')==='1'||document.cookie.indexOf('sibis_session=1')>=0||(window.name||'').indexOf('sibis_session=1')>=0||location.hash.indexOf('sibis=1')>=0;}catch(e){sesi=false;}
  if(sesi){
    try{
      GAS_URL=gasUrl;
      const ls=document.getElementById('loginScreen'),ap=document.getElementById('app');
      if(ls)ls.classList.add('hidden');
      if(ap){ap.classList.remove('hidden');ap.classList.add('flex');}
      autoLogin();
    }catch(e){}
  }
})();
